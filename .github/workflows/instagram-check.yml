# Checks the Instagram token and account (IG_ACCESS_TOKEN, IG_USER_ID): posts nothing.
# Run it from Actions -> Instagram check -> Run workflow after setting or renewing the token.
name: Instagram check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Token and account
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python tools/instagram-publisher/publish.py --check
