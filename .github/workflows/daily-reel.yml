# Daily reel: runs `python run.py ats` every night at 00:00 IST, keeps the reel as a downloadable artifact, posts it
# (Instagram reel + story, YouTube Short) and emails a report.
# Run it by hand from Actions -> Daily reel -> Run workflow: every choice is in that form (no file to upload).
# Before the first run (see README.md, "GitHub setup"):
#   - repository secrets: GEMINI_API_KEY, GROQ_API_KEY, JOB_FEED_API_KEY
#   - a release tagged `backgrounds` with the processed clips (clip1.mp4, clip2.mp4) attached as assets
name: Daily reel

on:
  schedule:
    - cron: "30 18 * * *"  # 00:00 IST (18:30 UTC), ats mode with the repo's settings; posts everywhere. GitHub often
                           # starts scheduled runs hours late; DAY is taken when the run starts, so it stays that day
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode: ats = fully automatic; custom = your script and choices below"
        type: choice
        options: [ats, custom]
        default: ats
      script:
        description: "Your script (custom). One line, lines split by ' | ', e.g.  hook: ZERO CALLS | Riya: Ma'am, call kyun nahi aata? | Malhotra (shocked): Kyunki... [show: https://...]   Empty = AI writes it"
        type: string
        default: ""
      hook:
        description: "On-screen hook card for your script (6 words max; a 'hook:' line in the script wins)"
        type: string
        default: ""
      left:
        description: "Left character (the one who knows)"
        type: choice
        options: [auto, arjun, bunty, riya, verma, malhotra]
        default: auto
      right:
        description: "Right character (the one who learns)"
        type: choice
        options: [auto, arjun, bunty, riya, verma, malhotra]
        default: auto
      series:
        description: "Use today's series episode (series/<date>.txt) when there is one; off = AI script"
        type: boolean
        default: true
      visuals:
        description: "Screenshots of real pages (job pages, product pages, [show: URL])"
        type: boolean
        default: true
      clip:
        description: "Background clip"
        type: choice
        options: [random, clip1.mp4, clip2.mp4]
        default: random
      track:
        description: "AI script: track"
        type: choice
        options: [auto, job_drop, product_pitch]
        default: auto
      niche:
        description: "AI script: job niche"
        type: choice
        options: [auto, india-freshers, remote-india, remote-worldwide, bangalore-tech, data-ai, design-ux, product-managers, sales-sdr, marketing, support-india, big-companies]
        default: auto
      format:
        description: "AI script: format"
        type: choice
        options: [auto, top-drop, guess-the-company, company-spotlight, number-shock, using-ai-wrong, direct-link-myth, two-minute-setup]
        default: auto
      platform:
        description: "AI script: where the CTA points"
        type: choice
        options: [auto, landing, apify, apify-mcp, n8n, make, rapidapi, api-market, zyla]
        default: auto
      settings:
        description: "Any other setting, split by ';'  e.g.  voice.voice.target_wps=3.6; captions.captions.size=110; compose.panel.scroll=120; compose.overlay.enabled=false  (keys as in config.toml / tools/*/config.toml)"
        type: string
        default: ""
      name:
        description: "Output name for your script (default: custom-<date>)"
        type: string
        default: ""
      instagram_reel:
        description: "Instagram: post the reel (the nightly cron always posts reel, story and Short)"
        type: boolean
        default: true
      instagram_story:
        description: "Instagram: post the same video as a story"
        type: boolean
        default: true
      youtube:
        description: "YouTube: upload as a Short"
        type: boolean
        default: true
      save_history:
        description: "Record this reel's jobs and ideas in content/history.json (so they don't repeat)"
        type: boolean
        default: true

permissions:
  contents: write   # to commit content/history.json

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      JOB_FEED_API_KEY: ${{ secrets.JOB_FEED_API_KEY }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      # the form's values reach the shell only as environment variables (never pasted into the script)
      IN_MODE: ${{ inputs.mode || 'ats' }}
      IN_SCRIPT: ${{ inputs.script }}
      IN_HOOK: ${{ inputs.hook }}
      IN_LEFT: ${{ inputs.left }}
      IN_RIGHT: ${{ inputs.right }}
      IN_SERIES: ${{ inputs.series }}
      IN_VISUALS: ${{ inputs.visuals }}
      IN_CLIP: ${{ inputs.clip }}
      IN_TRACK: ${{ inputs.track }}
      IN_NICHE: ${{ inputs.niche }}
      IN_FORMAT: ${{ inputs.format }}
      IN_PLATFORM: ${{ inputs.platform }}
      IN_SETTINGS: ${{ inputs.settings }}
      IN_NAME: ${{ inputs.name }}
      IN_SAVE_HISTORY: ${{ github.event_name == 'schedule' || inputs.save_history }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Background clips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download backgrounds --pattern "*.mp4" --dir public/bg-minecraft-video/input --skip-existing

      - name: Make the reel
        id: make
        run: |
          DAY=$(TZ=Asia/Kolkata date +%F)
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          args=("$IN_MODE" --date "$DAY")
          if [ -n "$IN_SCRIPT" ]; then
            name="${IN_NAME:-custom-$DAY}"
            echo "NAME=$name" >> "$GITHUB_ENV"
            if [[ "$IN_SCRIPT" == *.txt && -f "$IN_SCRIPT" ]]; then args+=("$IN_SCRIPT"); else args+=(--script-text "$IN_SCRIPT"); fi
            args+=(--name "$name")
          fi
          [ -n "$IN_HOOK" ] && args+=(--hook "$IN_HOOK")
          for k in left right track niche format platform; do
            v="IN_${k^^}"; v="${!v}"
            [ -n "$v" ] && [ "$v" != auto ] && args+=("--$k" "$v")
          done
          [ -n "$IN_CLIP" ] && [ "$IN_CLIP" != random ] && args+=(--clip "$IN_CLIP")
          [ "$IN_VISUALS" = false ] && args+=(--visuals off)
          [ "$IN_SERIES" = false ] && args+=(--no-series)
          [ -n "$IN_SETTINGS" ] && args+=(--set "$IN_SETTINGS")
          echo "python run.py ${args[*]}"
          python run.py "${args[@]}"

      - name: Keep the reel
        uses: actions/upload-artifact@v4
        with:
          # the run number tells two reels of one day apart (2026-10-31 had a manual run and the cron)
          name: reel-${{ env.DAY }}${{ env.NAME && format('-{0}', env.NAME) || '' }}-run${{ github.run_number }}
          # brief.json (premise, hook, dynamic, jobs) and visuals.json (which screenshots made it) let a reel be reviewed
          path: |
            content/${{ env.DAY }}/reel.mp4
            content/${{ env.DAY }}/script.md
            content/${{ env.DAY }}/script.json
            content/${{ env.DAY }}/brief.json
            content/${{ env.DAY }}/visuals.json
            content/${{ env.DAY }}/description.txt
            content/${{ env.DAY }}/posted.json
            content/${{ env.DAY }}/compose.json
            content/custom/${{ env.NAME }}/reel.mp4
            content/custom/${{ env.NAME }}/script.md
            content/custom/${{ env.NAME }}/script.json
            content/custom/${{ env.NAME }}/compose.json
            content/custom/${{ env.NAME }}/visuals.json
          if-no-files-found: warn
          retention-days: 30

      # after the artifact is kept, so a failed post never loses the reel
      - name: Post to Instagram
        id: instagram
        if: success() && (github.event_name == 'schedule' || inputs.instagram_reel || inputs.instagram_story)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # the cron (no inputs) posts both
          IN_IG_REEL: ${{ github.event_name == 'schedule' || inputs.instagram_reel }}
          IN_IG_STORY: ${{ github.event_name == 'schedule' || inputs.instagram_story }}
        run: |
          folder="content/$DAY"
          [ -n "$NAME" ] && folder="content/custom/$NAME"
          flags=()
          [ "$IN_IG_REEL" = true ] || flags+=(--no-reel)
          [ "$IN_IG_STORY" = true ] || flags+=(--no-story)
          python tools/instagram-publisher/publish.py --folder "$folder" "${flags[@]}"

      # each platform on its own: a failed Instagram post doesn't stop the YouTube upload or the history
      - name: Post to YouTube
        id: youtube
        if: always() && steps.make.outcome == 'success' && (github.event_name == 'schedule' || inputs.youtube)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          folder="content/$DAY"
          [ -n "$NAME" ] && folder="content/custom/$NAME"
          python tools/youtube-publisher/publish.py --folder "$folder"

      - name: Save history
        if: always() && steps.make.outcome == 'success' && env.IN_SAVE_HISTORY == 'true'
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add content/history.json
          git diff --cached --quiet || (git commit -m "history: reel for ${DAY}" && git push)

      # last, and always: what got made and posted, plus the last 60 days of Instagram and YouTube stats
      - name: Email report
        if: always()
        continue-on-error: true   # a mail problem never marks the reel's run as failed
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          OUT_MAKE: ${{ steps.make.outcome }}
          OUT_INSTAGRAM: ${{ steps.instagram.outcome }}
          OUT_YOUTUBE: ${{ steps.youtube.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          DAY="${DAY:-$(TZ=Asia/Kolkata date +%F)}"
          folder="content/$DAY"
          [ -n "$NAME" ] && folder="content/custom/$NAME"
          python tools/report/report.py --folder "$folder"
