# Posts a reel that a Daily reel run already made, after you have watched it (the review step), then emails the report.
# Actions -> Post reel -> Run workflow, with the run's number from its URL (.../actions/runs/<this number>).
# Whatever that run already posted (its posted.json) is skipped, so ticking everything never posts twice.
name: Post reel

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Daily reel run ID (the number in the run's URL: .../actions/runs/<run ID>)"
        type: string
        required: true
      instagram_reel:
        description: "Instagram: post the reel"
        type: boolean
        default: true
      instagram_story:
        description: "Instagram: post the same video as a story"
        type: boolean
        default: true
      youtube:
        description: "YouTube: upload as a Short (its 'subscribe' version when the run made one)"
        type: boolean
        default: true
      instagram_trial:
        description: "Instagram: post the run's trial reel (only non-followers see it), if it made one"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read     # to download the run's artifact

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the reel
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          RUN_ID="${RUN_ID//[[:space:]]/}"   # a pasted ID often carries a space (2026-11-02)
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "run_id must be a number"; exit 1; }
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" --dir reel-download
          # the reel itself, not one of its variants (variants/trial, variants/youtube sit in the same artifact)
          reel=$(find reel-download -path '*reel-*' -name reel.mp4 -not -path '*/variants/*' | head -n 1)
          [ -n "$reel" ] || { echo "no reel.mp4 in run $RUN_ID's artifacts"; exit 1; }
          folder=$(dirname "$reel")
          # the run's own post record (Daily reel keeps it as a separate artifact, after posting)
          record=$(find reel-download -path '*posted-*' -name posted.json | head -n 1)
          if [ -n "$record" ]; then cp "$record" "$folder/posted.json"; echo "already posted:"; cat "$folder/posted.json"; fi
          echo "FOLDER=$folder" >> "$GITHUB_ENV"
          echo "DAY=$(basename "$folder")" >> "$GITHUB_ENV"
          ls -la "$folder"
      - name: Post to Instagram
        id: instagram
        if: inputs.instagram_reel || inputs.instagram_story
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IN_IG_REEL: ${{ inputs.instagram_reel }}
          IN_IG_STORY: ${{ inputs.instagram_story }}
        run: |
          flags=()
          [ "$IN_IG_REEL" = true ] || flags+=(--no-reel)
          [ "$IN_IG_STORY" = true ] || flags+=(--no-story)
          python tools/instagram-publisher/publish.py --folder "$FOLDER" "${flags[@]}"
      - name: Post trial reel
        id: trial
        if: always() && steps.download.outcome == 'success' && inputs.instagram_trial
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python tools/instagram-publisher/publish.py --folder "$FOLDER" --trial
      - name: Post to YouTube
        id: youtube
        if: always() && steps.download.outcome == 'success' && inputs.youtube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python tools/youtube-publisher/publish.py --folder "$FOLDER"
      - name: Keep the post record
        if: always() && steps.download.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: posted-run${{ inputs.run_id }}-repost${{ github.run_number }}
          path: ${{ env.FOLDER }}/posted.json
          if-no-files-found: warn

      # last, and always: what is up where, plus the last 60 days of Instagram and YouTube stats
      - name: Email report
        if: always()
        continue-on-error: true
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # optional: with both, the report shows when the Instagram token expires (debug_token needs an app token)
          META_APP_ID: ${{ secrets.META_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          OUT_MAKE: ${{ steps.download.outcome }}
          OUT_INSTAGRAM: ${{ steps.instagram.outcome }}
          OUT_YOUTUBE: ${{ steps.youtube.outcome }}
          OUT_TRIAL: ${{ steps.trial.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$FOLDER" ] || { echo "no reel downloaded"; FOLDER="reel-download/none"; mkdir -p "$FOLDER"; }
          python tools/report/report.py --folder "$FOLDER"
