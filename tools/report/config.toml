# report: the email sent after each Daily reel run. See report.py.

[report]
days = 60                         # the stats window (posts published in the last N days)
to_env = "REPORT_TO"              # recipient; empty = the sender's own address
smtp_user_env = "SMTP_USER"       # a Gmail address
smtp_password_env = "SMTP_PASSWORD"  # a Gmail app password (Google account -> Security -> App passwords), not the login
smtp_host = "smtp.gmail.com"
smtp_port = 465
env_files = ["../../.env"]
# Every Daily reel report adds its numbers here (--save-stats); the next reports show the growth since the report
# ~24 h and ~7 days ago. Snapshots older than keep_stats_days are dropped.
stats_file = "../../content/stats-history.json"
keep_stats_days = 120
# per platform, the newest N posts go in the mail; the full lists of the window come as an attached HTML file
rows_in_mail = 10
# Metric lists below (2026-11-12): add or remove names here, no code change. A metric the API refuses is named once in
# the mail (with Meta's / Google's reason) and the rest still show; a new one appears as a column or in the account line.
account_days = 7                  # window for the account totals (Instagram / Facebook Page / Threads / YouTube channel)

[instagram]
api_version = "v26.0"
token_env = "IG_ACCESS_TOKEN"
user_env = "IG_USER_ID"
# needs the Meta configuration's instagram_manage_insights permission; without it, likes and comments only
media_metrics = ["views", "reach", "saved", "shares", "ig_reels_avg_watch_time", "follows", "profile_visits"]
# account totals: where follows are lost (views -> profile visits -> follows); follows_and_unfollows needs 100+ followers
account_metrics = ["views", "reach", "profile_views", "profile_links_taps", "accounts_engaged", "total_interactions",
                   "follows_and_unfollows"]
follow_type_split = ["views", "reach"]   # share of these that came from people who don't follow yet

[facebook]
api_version = "v26.0"
token_env = "FB_PAGE_TOKEN"
page_env = "FB_PAGE_ID"
# video_insights of a Page reel; any the token can't read are left out (with a note in the mail). Needs read_insights
# on the Page token. post_impressions_unique (reach) was dropped 2026-11-10: refused for reels even with read_insights.
reel_metrics = ["blue_reels_play_count", "post_video_avg_time_watched",
                "post_video_likes_by_reaction_type", "post_video_social_actions"]

# Page totals: "sum" adds up the daily values, "last" takes the newest (running totals)
[facebook.page_metrics]
page_follows = "last"
page_daily_follows_unique = "sum"
page_views_total = "sum"
page_post_engagements = "sum"
page_video_views = "sum"

[threads]
token_env = "THREADS_ACCESS_TOKEN"
user_env = "THREADS_USER_ID"
post_metrics = ["views", "likes", "replies", "reposts", "quotes", "shares"]   # needs threads_manage_insights
account_metrics = ["views", "likes", "replies", "reposts", "clicks", "followers_count"]

[telegram]
token_env = "TELEGRAM_BOT_TOKEN"
channel_env = "TELEGRAM_CHANNEL"

[youtube]
# needs the youtube.readonly scope (authorize.py); without it the email says so
client_id_env = "YT_CLIENT_ID"
client_secret_env = "YT_CLIENT_SECRET"
refresh_token_env = "YT_REFRESH_TOKEN"
# YouTube Analytics (yt-analytics.readonly): extra columns per Short, and the channel totals
video_metrics = ["subscribersGained", "shares", "engagedViews"]
channel_metrics = ["views", "engagedViews", "estimatedMinutesWatched", "averageViewDuration", "subscribersGained", "subscribersLost"]
