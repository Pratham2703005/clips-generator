# Idea banks for variety (user, 2026-10-30: three reels in a row opened on "200 applications" and a roast).
# Every reel draws one premise, one hook formula and one dynamic; cooldowns in config.toml [rules] keep them from
# repeating soon. Premises come from what Indian freshers and early-career people actually complain about (off-campus
# drives, ghosting, CTC vs in-hand, notice periods, Telegram drive groups, referrals). No numbers here: any number in a
# script must still come from the brief.
# `fits`: the tracks a premise suits (job_drop = jobs reel, product_pitch = API/n8n/MCP reel).

# ---------------------------------------------------------------- premises
