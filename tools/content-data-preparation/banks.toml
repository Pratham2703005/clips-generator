# ---------------------------------------------------------------- hook formulas (from the ig-reel skill, 26)
# The script adapts one to Hinglish for line 1. `numbers` = the formula needs a number: only use one from the brief.
[[hooks]]
id = "cost-confession"
name = "Cost Confession"
template = "{one mistake} cost me {something real: weeks, an offer, a job}."
example = "Ek galat resume ne mujhse teen interviews chheen liye."
numbers = true
[[hooks]]
id = "negative-command"
name = "Negative Command"
template = "Stop {common action}. Do {alternative} instead."
example = "Job boards pe apply karna band karo. Pehle company ka career page dekho."
[[hooks]]
id = "nobody-tells-you"
name = "Nobody Tells You"
template = "Nobody tells you that {uncomfortable truth}."
example = "Nobody tells you ki 'immediate joiner' ka matlab hai 'kal se aao'."
[[hooks]]
id = "replacement"
fits = ["product_pitch"]  # "X replaced Y" reads as a product line
name = "The Replacement"
template = "{This thing} replaced {annoying thing}."
example = "Ek n8n template ne mere tees job alert emails replace kar diye."
[[hooks]]
id = "time-collapse"
fits = ["product_pitch"]
name = "Time Collapse"
template = "{Thing} used to take {long}. Now it takes {short}."
example = "Jobs dhoondhne mein poora din jaata tha. Ab chai khatam hone tak ho jaata hai."
[[hooks]]
id = "receipt"
name = "The Receipt"
template = "I did {thing} for {time}. Here's what happened."
example = "Maine ek hafta sirf career pages pe apply kiya. Result dekho."
[[hooks]]
id = "wrong-way-right-way"
name = "Wrong Way, Right Way"
template = "You're doing {thing} wrong, and it's not your fault."
example = "Tum job search galat kar rahe ho, aur ismein tumhari galti nahi hai."
[[hooks]]
id = "insider-leak"
knows = ["malhotra"]  # "I spent years in HR" only fits the HR insider
name = "Insider Leak"
template = "I spent years {inside the thing}. Here's what we never say out loud."
example = "Main saalon se HR mein hoon. Ye baat hum kabhi bolte nahi."
[[hooks]]
id = "the-steal"
name = "The Steal"
template = "Steal this {thing}."
example = "Ye job search trick chura lo. Mujhe seekhne mein ek saal laga."
[[hooks]]
id = "if-this-then-watch"
name = "If This, Then Watch"
template = "If you {specific situation}, watch this."
example = "Agar HR ne tumhe ghost kiya hai, ye reel tumhare liye hai."
[[hooks]]
id = "numbered-favourite"
name = "Numbered With A Favourite"
template = "{N} {things}. Number {k} is the one nobody uses."
example = "Teen job search tricks. Teesri wali koi use nahi karta."
[[hooks]]
id = "the-objection"
name = "The Objection"
template = "\"{Objection they actually say}.\" Fine. Here's what works anyway."
example = "'Mere paas experience nahi hai.' Theek hai. Phir bhi ye karo."
[[hooks]]
id = "before-after"
name = "Before And After"
template = "{Old way}. {New way}. {The one lever}."
example = "Pehle: forty tabs, zero calls. Ab: ek alert, roz subah."
[[hooks]]
id = "the-callout"
name = "The Callout"
template = "{Specific group}, this is the one you've been ignoring."
example = "Freshers jo sirf bade brands pe apply karte ho, ye tumhare liye hai."
[[hooks]]
id = "flop-record"
name = "The Flop Record"
template = "My first {attempts} did nothing. Here's what changed."
example = "Meri pehli saari applications fail hui. Phir ek cheez badli."
[[hooks]]
id = "verbatim-question"
name = "The Verbatim Question"
template = "\"{Question exactly as asked}\" I get this every week."
example = "'Ma'am, mujhe call kyun nahi aata?' Ye sawaal har hafte aata hai."
[[hooks]]
id = "head-to-head"
name = "Head To Head"
template = "{A} versus {B}. One wasn't even close."
example = "Job board versus company career page. Mukabla tha hi nahi."
[[hooks]]
id = "cold-open"
name = "Cold Open"
template = "{Start mid-action.} Watch this."
example = "Dekho, ye job kal raat post hui hai. Abhi tak kisi ne dekhi bhi nahi."
[[hooks]]
id = "the-deadline"
name = "The Deadline"
template = "{Thing} is closing soon. Do {action} before then."
example = "Placement season khatam hone se pehle ye ek kaam kar lo."
[[hooks]]
id = "permission"
name = "Permission"
template = "You don't need {the thing everyone says you need}."
example = "Tumhe referral ki zaroorat nahi hai. Tumhe timing chahiye."
[[hooks]]
id = "mid-sentence"
name = "Mid-Sentence Start"
template = "...and that's when {the turn}."
example = "...aur tab HR ne bola, 'we'll get back to you.' Teen mahine pehle."
[[hooks]]
id = "contrarian-flip"
name = "Contrarian Flip"
template = "{Well-known saying, inverted.}"
example = "Jaldi apply karna smart nahi hai. Sahi jagah apply karna smart hai."
[[hooks]]
id = "the-statistic"
name = "The Statistic"
template = "{Number from the brief} {surprising fact}."
example = "Over four hundred thousand new jobs last week. Tumne kitni dekhi?"
numbers = true
[[hooks]]
id = "the-reveal"
name = "The Reveal"
template = "This is the new {thing}."
example = "Ye hai naya tareeka job dhoondhne ka. Bina job board ke."
[[hooks]]
id = "someone-elses-result"
name = "Someone Else's Result"
template = "There was one {person} who {outcome}."
example = "Mera ek dost tha jisne ek hafte mein teen interview calls le liye."
[[hooks]]
id = "superlative"
name = "The Superlative"
template = "The {fastest / only} way to {thing} is {answer}."
example = "Fresh job pakadne ka sabse fast tareeka: company ka apna page."

# ---------------------------------------------------------------- dynamics (who does what to whom)
[[dynamics]]
id = "classic-roast"
text = "The one who knows roasts the learner's mistake, then shows the better way."
[[dynamics]]
id = "learner-bites-back"
text = "The learner keeps landing comebacks; the expert wins only at the very end."
[[dynamics]]
id = "both-vs-system"
text = "Both characters team up against the absurd job market and roast it together."
[[dynamics]]
id = "expert-caught-out"
text = "The expert gets something wrong first, gets roasted, then recovers with the real answer."
[[dynamics]]
id = "quiz-show"
text = "The expert runs a quick quiz or guessing game; the learner's wrong guesses are the jokes."
[[dynamics]]
id = "mock-interview"
text = "The expert plays interviewer; the learner's answers get worse, then one smart move saves them."
[[dynamics]]
id = "therapy-session"
text = "The learner vents dramatically like in therapy; the expert answers like a deadpan doctor with a prescription."
[[dynamics]]
id = "news-anchor"
text = "One character reports the job market like breaking news; the other reacts live."
[[dynamics]]
id = "detective"
text = "The expert investigates why the learner gets no calls, like a detective, and names the culprit."
[[dynamics]]
id = "challenge"
text = "A bet or challenge: the learner tries their way, the expert tries theirs, and the result is the punchline."
[[dynamics]]
id = "flashback"
text = "Starts with the learner's past disaster as a flashback, then the expert shows what should have happened."
[[dynamics]]
id = "reverse-mentor"
learns = ["verma"]  # the younger teaches the older: only when Verma is the learner
text = "The younger one teaches the older one something modern, with mutual roasting about age."
