# youtube-publisher: uploads the day's reel to YouTube as a Short. See publish.py; authorize.py makes the refresh token.

[youtube]
client_id_env = "YT_CLIENT_ID"          # OAuth client (Desktop app) of the Google Cloud project
client_secret_env = "YT_CLIENT_SECRET"
refresh_token_env = "YT_REFRESH_TOKEN"  # from authorize.py; the OAuth app must be "In production" or it dies in 7 days
env_files = ["../../.env"]              # for runs on the PC; the workflow passes repository secrets instead
repo = "Pratham2703005/clips-generator" # where authorize.py saves the three secrets
# the channel the Shorts belong to ("Isha - Job Shorts and Interview tips", @isha_jobs). The Google account also has a
# personal channel; picking it at sign-in (2026-11-16) gave a token for the wrong channel, so authorize.py and
# reoptimize.py now refuse any other.
channel_id = "UCOsO_DVhIVEnBkeUDNgsqAw"

[video]
privacy = "public"                      # public | unlisted | private
category_id = "27"                      # Education (22 = People & Blogs)
language = "hi"                         # title/description and audio language (Hinglish)
made_for_kids = false
synthetic_media = false                 # cartoon characters: not "realistic altered or synthetic" content
title_max = 100                         # YouTube's limit
description_max = 5000                  # YouTube's limit
shorts_tag = true                       # adds #Shorts to the title when it fits
publish_at = ""                         # IST "HH:MM": the upload stays private (scheduled) until then; "" = public at once
# 2026-11-22 (user): no schedule, the Short goes public with every other platform. Before: 19:00 from 2026-11-14,
# 18:00 until 2026-11-12, then 08:00 for two days. A time under 15 minutes away publishes at once.
# SEO (user's notes, 2026-11-16)
hook_in_title = true                    # title = search line + the hook card in sentence case ("... | Na hardworking. Na passionate.")
suggest_tags = true                     # tags = the search phrases + YouTube search-box suggestions + the #hashtags
tags_max_chars = 450                    # YouTube allows 500
captions = true                         # caption tracks from the script's own words, after the upload (needs youtube.force-ssl)
caption_languages = ["hi-Latn", "en"]   # Hinglish (the exact script) and English (translated by Gemini)
translate_models = ["gemini-3.5-flash-lite", "gemini-3.5-flash", "gemini-3.6-flash"]  # tried in turn (503 "high demand" happens)
thumbnail = true                       # try the Instagram cover frame as thumbnail (needs a Partner Program channel today)
cover_seconds = 2.2                     # the cover frame when compose.json has no cover_seconds (as [instagram])
site_url = "https://ats-jobs-api.pk2732004.workers.dev"  # replaces "link in bio" in the description ("" = keep the text)
