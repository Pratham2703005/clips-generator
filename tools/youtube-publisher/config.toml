# youtube-publisher: uploads the day's reel to YouTube as a Short. See publish.py; authorize.py makes the refresh token.

[youtube]
client_id_env = "YT_CLIENT_ID"          # OAuth client (Desktop app) of the Google Cloud project
client_secret_env = "YT_CLIENT_SECRET"
refresh_token_env = "YT_REFRESH_TOKEN"  # from authorize.py; the OAuth app must be "In production" or it dies in 7 days
env_files = ["../../.env"]              # for runs on the PC; the workflow passes repository secrets instead
repo = "Pratham2703005/clips-generator" # where authorize.py saves the three secrets

[video]
privacy = "public"                      # public | unlisted | private
category_id = "27"                      # Education (22 = People & Blogs)
language = "hi"                         # title/description and audio language (Hinglish)
made_for_kids = false
synthetic_media = false                 # cartoon characters: not "realistic altered or synthetic" content
title_max = 100                         # YouTube's limit
description_max = 5000                  # YouTube's limit
shorts_tag = true                       # adds #Shorts to the title when it fits
publish_at = "19:00"                    # IST, same day: the night's upload stays private (scheduled) until then; "" = at once
# 2026-11-14 (user): 08:00 -> 19:00 from now on. Earlier: 18:00 until 2026-11-12, then 08:00 for two days.
# A run after 18:45 publishes at once (publish_time() needs 15 minutes).
thumbnail = true                        # try the Instagram cover frame as thumbnail (needs a Partner Program channel today)
cover_seconds = 2.2                     # the cover frame when compose.json has no cover_seconds (as [instagram])
site_url = "https://ats-jobs-api.pk2732004.workers.dev"  # replaces "link in bio" in the description ("" = keep the text)
