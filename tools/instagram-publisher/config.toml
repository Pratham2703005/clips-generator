# instagram-publisher: posts the day's reel to Instagram as a Reel and/or a story. See publish.py.

[instagram]
api_version = "v26.0"
token_env = "IG_ACCESS_TOKEN"     # the Meta app's system-user token (Unified login configuration); never printed
user_env = "IG_USER_ID"           # the Instagram account ID (17841...), shown on the Meta app's API setup page
env_files = ["../../.env"]        # for runs on the PC; the workflow passes repository secrets instead
caption_max = 2200                # Instagram's limit
hashtags_max = 5                  # Instagram's per-post limit (reported from 2025-12-18); extra ones are dropped from the end
chunk_mb = 8                      # a failed one-piece upload is retried once in pieces of this size
# Still refused (ProcessingFailedError)? Instagram fetches the reel from a temporary asset on this public release instead
# (video_url), deleted right after. Needs the gh CLI and GH_TOKEN; "" = no fallback, the post fails.
release_tag = "reel-uploads"
repo = "Pratham2703005/clips-generator"   # when GITHUB_REPOSITORY isn't set (runs on the PC)
cover_seconds = 2.2               # the reel's cover frame when compose.json has no cover_seconds (the full hook card)
trial_graduation = "MANUAL"       # trial reels: MANUAL = stays a trial unless moved in the app; SS_PERFORMANCE = Instagram moves a good one to the main feed

[poll]
every_seconds = 10                # Instagram processes the video before it can be published
max_minutes = 10
